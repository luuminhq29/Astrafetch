name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ARM64 linker
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.arch }}/usr/bin
          cp target/${{ matrix.target }}/release/astrafetch dist/${{ matrix.arch }}/usr/bin/astrafetch
          ln -s astrafetch dist/${{ matrix.arch }}/usr/bin/asfetch
          mkdir -p dist/${{ matrix.arch }}/DEBIAN
          sed "s/^Architecture:.*/Architecture: ${{ matrix.arch }}/" packaging/debian/control > dist/${{ matrix.arch }}/DEBIAN/control
          dpkg-deb --build --root-owner-group dist/${{ matrix.arch }} astrafetch_1.0.0_${{ matrix.arch }}.deb
      - uses: actions/upload-artifact@v4
        with:
          name: astrafetch-${{ matrix.arch }}
          path: astrafetch_1.0.0_${{ matrix.arch }}.deb
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
