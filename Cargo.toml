[package]
name = "astrafetch"
version = "1.0.0"
edition = "2021"
authors = ["Lưu Minh Quang - Astra"]
description = "A modern, fast and animated Linux system information tool."
license = "MIT"
readme = "README.md"
repository = "https://github.com/astrafetch/astrafetch"
keywords = ["linux", "system-information", "terminal", "tui", "fetch"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "astrafetch"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
